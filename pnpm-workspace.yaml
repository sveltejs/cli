# This Exclude list is for "sv-utils" that we trust & bundle.
# But keep in mind that sv users may not have any exclude list!
minimumReleaseAgeExclude:
  - '@sveltejs/*'
  - svelte
  - esrap
  - devalue
  - zimmerframe
  - prettier-plugin-svelte
  - svelte-check
  - esm-env

packages:
  - 'packages/*'
  - '!.test-tmp/**'
  - '!**/.test-output/**'

allowBuilds:
  esbuild: true
