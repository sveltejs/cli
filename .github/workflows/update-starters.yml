name: Update starters (manual)

on:
  workflow_dispatch:
    inputs:
      starter:
        description: Which starter to update
        type: choice
        default: all
        options:
          - all
          - kit-template-default
          - kit-template-railway

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'sveltejs/cli'
    name: Update starters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 22.18
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Update kit starter
        if: inputs.starter == 'all' || inputs.starter == 'kit-template-default'
        run: pnpm update:kit-starter
        env:
          UPDATE_TEMPLATE_SSH_KEY: ${{ secrets.UPDATE_TEMPLATE_SSH_KEY }}

      - name: Update railway starter
        if: inputs.starter == 'all' || inputs.starter == 'kit-template-railway'
        run: pnpm update:railway-starter
        env:
          UPDATE_RAILWAY_TEMPLATE_SSH_KEY: ${{ secrets.UPDATE_RAILWAY_TEMPLATE_SSH_KEY }}
