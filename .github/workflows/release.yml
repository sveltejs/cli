name: Release

on:
  push:
    branches:
      - main

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'sveltejs/cli'
    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # OpenID Connect token needed for provenance
      pull-requests: write # to create pull request (changesets/action)
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm changeset:publish
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Require addon integration tests on Changesets PR
        if: steps.changesets.outputs['pr-number'] != ''
        run: >-
          gh pr edit "${{ steps.changesets.outputs['pr-number'] }}"
          --add-label needs-addon-integration-tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update kit starter
        if: steps.changesets.outputs.published == 'true'
        run: pnpm update:kit-starter
        env:
          UPDATE_TEMPLATE_SSH_KEY: ${{ secrets.UPDATE_TEMPLATE_SSH_KEY }}

      - name: Update Railway starter
        if: steps.changesets.outputs.published == 'true'
        run: pnpm update:railway-starter
        env:
          UPDATE_RAILWAY_TEMPLATE_SSH_KEY: ${{ secrets.UPDATE_RAILWAY_TEMPLATE_SSH_KEY }}
